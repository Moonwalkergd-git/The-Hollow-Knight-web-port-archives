<script>
const lt=document.getElementById("loading-text"),
      cv=document.getElementById("unity-canvas"),
      mw=document.getElementById("unity-mobile-warning"),
      tb=document.getElementById("toolbar");
// -------- SPEEDRUN TIMER --------
const timerBox =
  document.getElementById("speedrun-timer");

const timerDisplay =
  document.getElementById("timer-display");

let timerEnabled = false;
let timerRunning = false;
let timerElapsed = 0;
let timerStart = 0;

// Lightweight toolbar button
const timerBtn =
  document.createElement("button");

timerBtn.className = "savebtn";
timerBtn.textContent = "Timer: OFF";

timerBtn.onclick = () => {
  timerEnabled = !timerEnabled;

  timerBox.style.display =
    timerEnabled ? "block" : "none";

  timerBtn.textContent =
    timerEnabled
      ? "Timer: ON"
      : "Timer: OFF";

  if (!timerEnabled) {
    timerRunning = false;
  }
};

tb.appendChild(timerBtn);

function formatTimer(ms) {
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  const msPart = Math.floor(ms % 1000);

  return (
    String(h).padStart(2,"0") + ":" +
    String(m).padStart(2,"0") + ":" +
    String(s).padStart(2,"0") + "." +
    String(msPart).padStart(3,"0")
  );
}

// Efficient Chromebook update loop
setInterval(() => {
  if (
    !timerEnabled ||
    !timerRunning
  ) return;

  timerElapsed =
    performance.now() - timerStart;

  timerDisplay.textContent =
    formatTimer(timerElapsed);
}, 33);

// Hotkeys
document.addEventListener(
  "keydown",
  e => {
    if (
      !timerEnabled ||
      e.repeat
    ) return;

    const key =
      e.key.toLowerCase();

    // T = Start/Pause
    if (key === "t") {
      if (timerRunning) {
        timerRunning = false;
      } else {
        timerRunning = true;
        timerStart =
          performance.now()
          - timerElapsed;
      }
    }

    // R = Reset
    if (key === "r") {
      timerRunning = false;
      timerElapsed = 0;

      timerDisplay.textContent =
        "00:00:00.000";
    }
  }
);

let lb=0;
const tm='912.81';

// -------- Create FPS text element --------

// -------- Track pressed keys --------
const pressedKeys = new Set();

document.addEventListener('keydown', (event) => {
  pressedKeys.add(event.key);
  updateKeystrokeDisplay();
});

document.addEventListener('keyup', (event) => {
  pressedKeys.delete(event.key);
  updateKeystrokeDisplay();
});

function updateKeystrokeDisplay() {
  keystrokeDisplay.innerHTML = '';
  Array.from(pressedKeys).forEach(key => {
    const icon = document.createElement('img');
    icon.src = makeKeyIcon(key);
    icon.alt = key;
    icon.title = prettyKeyName(key);
    icon.style = `
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 10px 24px rgba(0,0,0,0.18);
      object-fit: contain;
    `;
    keystrokeDisplay.appendChild(icon);
  });
}

function prettyKeyName(key) {
  if (key === ' ') return 'Space';
  if (key === 'ArrowUp') return 'Arrow Up';
  if (key === 'ArrowDown') return 'Arrow Down';
  if (key === 'ArrowLeft') return 'Arrow Left';
  if (key === 'ArrowRight') return 'Arrow Right';
  return key.length === 1 ? key.toUpperCase() : key.replace(/^(.)/, s => s.toUpperCase());
}

function makeKeyIcon(key) {
  const label = prettyKeyName(key);
  const svg = `
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#20222A"/>
      <stop offset="100%" stop-color="#2F323D"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="108" height="108" rx="28" ry="28" fill="url(#g)" stroke="rgba(255,255,255,0.16)" stroke-width="4"/>
  ${arrowIcon(label)}
  <text x="60" y="70" text-anchor="middle" fill="#F4F6FB" font-family="Segoe UI, system-ui, sans-serif" font-size="44" font-weight="700">${svgText(label)}</text>
</svg>`;
  return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
}

function arrowIcon(label) {
  const arrows = {
    'Arrow Up': '<path d="M60 28 L40 64 L52 64 L52 88 L68 88 L68 64 L80 64 Z" fill="#E7E9F3" opacity="0.85"/>',
    'Arrow Down': '<path d="M60 92 L40 56 L52 56 L52 32 L68 32 L68 56 L80 56 Z" fill="#E7E9F3" opacity="0.85"/>',
    'Arrow Left': '<path d="M28 60 L64 40 L64 52 L88 52 L88 68 L64 68 L64 80 Z" fill="#E7E9F3" opacity="0.85"/>',
    'Arrow Right': '<path d="M92 60 L56 40 L56 52 L32 52 L32 68 L56 68 L56 80 Z" fill="#E7E9F3" opacity="0.85"/>'
  };
  return arrows[label] || '';
}

function svgText(label) {
  if (/^Arrow/.test(label)) {
    return '';
  }
  if (label.length > 2) {
    return label.slice(0, 2);
  }
  return label;
}

// -------- FPS update loop --------
let lastTime = performance.now();
function updateFPS() {
  const now = performance.now();
  const dt = (now - lastTime) / 1000;
  lastTime = now;

  const fps = dt > 0 ? (1 / dt) : 60;
  fpsText.textContent = "FPS: " + Math.round(fps);

  requestAnimationFrame(updateFPS);
}

// -------- Chunked fetch & merge --------
async function fwp(u){
  const r=await fetch(u),
        rd=r.body.getReader(),
        ch=[];
  while(true){
    const{done,value}=await rd.read();
    if(done)break;
    lb+=value.length;
    ch.push(value);
    lt.textContent=`${(lb/1048576).toFixed(2)} MB / ${tm} MB`;
  }
  return URL.createObjectURL(new Blob(ch));
}
async function mf(p){
  const b=await Promise.all(p.map(fwp)),
        bl=await Promise.all(b.map(u=>fetch(u).then(r=>r.blob())));
  return URL.createObjectURL(new Blob(bl));
}
function gp(f,s,e){
  return Array.from({length:e-s+1},(_,i)=>`${f}.part${s+i}`);
}

// -------- ASSET INJECTION SYSTEM --------
class TextureReplacer {
  constructor() {
    this.replacements = new Map();
    this.loadedImages = new Map();
    this.init();
  }
  
  init() {
    // Intercept Image loading
    const self = this;
    const OriginalImage = window.Image;
    const ImageProxy = function() {
      const img = new OriginalImage();
      
      Object.defineProperty(img, 'src', {
        set: function(url) {
          const replacement = self.findReplacementForUrl(url);
          if (replacement) {
            console.log("🎨 Replacing image:", url);
            OriginalImage.prototype.src.setter.call(this, replacement);
          } else {
            OriginalImage.prototype.src.setter.call(this, url);
          }
        },
        get: function() {
          return OriginalImage.prototype.src.getter.call(this);
        }
      });
      
      return img;
    };
    
    window.Image = ImageProxy;
    
    // Hook canvas drawing to replace images
    const originalCanvasGetContext = HTMLCanvasElement.prototype.getContext;
    HTMLCanvasElement.prototype.getContext = function(contextType, ...args) {
      const context = originalCanvasGetContext.call(this, contextType, ...args);
      
      if (contextType === '2d') {
        const originalDrawImage = context.drawImage;
        context.drawImage = function(image, ...args) {
          if (image instanceof HTMLImageElement || image instanceof HTMLCanvasElement) {
            const replacement = self.tryGetReplacement(image);
            if (replacement) {
              return originalDrawImage.call(this, replacement, ...args);
            }
          }
          return originalDrawImage.call(this, image, ...args);
        };
      }
      
      return context;
    };
    
    // Load skin assets
    this.loadSkinAssets();
  }
  
  loadSkinAssets() {
    const assetsJson = localStorage.getItem("hk_active_skin_assets");
    if (assetsJson) {
      try {
        const assets = JSON.parse(assetsJson);
        for (const [fileName, url] of Object.entries(assets)) {
          this.addReplacement(fileName, url);
        }
        console.log("%c🎨 SKIN SYSTEM: Loaded " + this.replacements.size + " texture replacements", "color: #FFD700; font-weight: bold;");
      } catch (e) {
        console.warn("Failed to load skin assets:", e);
      }
    }
  }
  
  addReplacement(spriteName, imageUrl) {
    this.replacements.set(spriteName.toLowerCase(), imageUrl);
  }
  
  findReplacementForUrl(url) {
    if (typeof url !== 'string') return null;
    const urlLower = url.toLowerCase();
    
    for (const [name, replacement] of this.replacements.entries()) {
      if (urlLower.includes(name) || name.includes(urlLower.split('/').pop())) {
        return replacement;
      }
    }
    return null;
  }
  
  tryGetReplacement(image) {
    const src = image.src || image.currentSrc || '';
    const replacement = this.findReplacementForUrl(src);
    
    if (replacement && !this.loadedImages.has(src)) {
      const img = new window.Image();
      img.crossOrigin = "anonymous";
      img.onload = () => {
        this.loadedImages.set(src, img);
      };
      img.src = replacement;
      return img;
    }
    
    return this.loadedImages.get(src) || null;
  }
}

// -------- GAME STATE PERSISTENCE --------
class GameStatePersistence {
  constructor() {
    this.db = null;
    this.init();
  }
  
  async init() {
    return new Promise((resolve) => {
      const req = indexedDB.open("HKGameState", 1);
      
      req.onerror = () => {
        console.warn("Failed to open game state DB");
        resolve();
      };
      
      req.onsuccess = () => {
        this.db = req.result;
        console.log("✓ Game state persistence initialized");
        resolve();
      };
      
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains("state")) {
          db.createObjectStore("state", { keyPath: "key" });
        }
      };
    });
  }
  
  async saveState(key, data) {
    if (!this.db) return;
    
    try {
      const tx = this.db.transaction("state", "readwrite");
      const store = tx.objectStore("state");
      
      await new Promise((resolve, reject) => {
        const req = store.put({
          key: key,
          data: data,
          timestamp: Date.now()
        });
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
      
      // Also backup to localStorage
      try {
        localStorage.setItem(`hk_state_${key}`, JSON.stringify(data));
      } catch (e) {
        console.warn("localStorage quota exceeded");
      }
      
      console.log("Saved state:", key);
    } catch (error) {
      console.error("Error saving state:", error);
    }
  }
  
  async loadState(key) {
    // Try IndexedDB first
    if (this.db) {
      try {
        const tx = this.db.transaction("state", "readonly");
        const store = tx.objectStore("state");
        
        const result = await new Promise((resolve, reject) => {
          const req = store.get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
        
        if (result) {
          console.log("Loaded state from IndexedDB:", key);
          return result.data;
        }
      } catch (error) {
        console.warn("Error loading from IndexedDB:", error);
      }
    }
    
    // Fallback to localStorage
    try {
      const data = localStorage.getItem(`hk_state_${key}`);
      if (data) {
        console.log("Loaded state from localStorage:", key);
        return JSON.parse(data);
      }
    } catch (error) {
      console.warn("Error loading from localStorage:", error);
    }
    
    return null;
  }
  
  async exportAllState() {
    if (!this.db) return {};
    
    try {
      const tx = this.db.transaction("state", "readonly");
      const store = tx.objectStore("state");
      
      const allData = await new Promise((resolve, reject) => {
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      
      const exported = {};
      allData.forEach(item => {
        exported[item.key] = item.data;
      });
      
      return exported;
    } catch (error) {
      console.error("Error exporting state:", error);
      return {};
    }
  }
}

// -------- EXPORT SAVE (slot-based) --------
function asb() {
  const btn = document.createElement("button");
  btn.className = "savebtn";
  btn.textContent = "Download Save";
  btn.onclick = savedownload;
  tb.appendChild(btn);
}

function savedownload() {
  const slot = prompt("Which slot do you want to export? (1–4)");
  if (!slot || slot < 1 || slot > 4) return;

  const openReq = indexedDB.open("/idbfs");

  openReq.onsuccess = async e => {
    const db = e.target.result;
    const tx = db.transaction("FILE_DATA", "readonly");
    const store = tx.objectStore("FILE_DATA");

    store.getAllKeys().onsuccess = ev => {
      const keys = ev.target.result;
      if (!keys.length) {
        alert("No save data found.");
        return;
      }

      const firstKey = keys[0];
      const currentHash = firstKey.split("/")[2];
      const key = `/idbfs/${currentHash}/user${slot}.dat`;

      store.get(key).onsuccess = ev2 => {
        const entry = ev2.target.result;
        if (!entry) {
          alert(`Slot ${slot} is empty.`);
          return;
        }

        const blob = new Blob([entry.contents], { type: "application/octet-stream" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = `user${slot}.dat`;
        a.click();

        URL.revokeObjectURL(url);
        
        // Save backup to game state
        gameState.saveState(`slot_${slot}_backup`, {
          date: new Date().toISOString(),
          size: entry.contents.byteLength
        });
      };
    };
  };
}

// -------- IMPORT SAVE (slot-based) --------
function asib() {
  const btn = document.createElement("button");
  btn.className = "savebtn";
  btn.textContent = "Import Save";
  btn.onclick = () => input.click();
  tb.appendChild(btn);
}

const input = document.createElement("input");
input.type = "file";
input.accept = ".dat";
input.style.display = "none";
document.body.appendChild(input);

input.onchange = () => {
  const file = input.files[0];
  if (!file) return;

  const slot = prompt("Import into which slot? (1–4)");
  if (!slot || slot < 1 || slot > 4) return;

  const reader = new FileReader();
  reader.onload = async () => {
    const buffer = reader.result;
    const bytes = new Uint8Array(buffer);

    const req = indexedDB.open("/idbfs");
    req.onsuccess = e => {
      const db = e.target.result;
      const tx = db.transaction("FILE_DATA", "readwrite");
      const store = tx.objectStore("FILE_DATA");

      store.getAllKeys().onsuccess = ev => {
        const keys = ev.target.result;
        if (!keys.length) {
          console.error("No keys found in FILE_DATA");
          return;
        }

        const firstKey = keys[0];
        const currentHash = firstKey.split("/")[2];
        const key = `/idbfs/${currentHash}/user${slot}.dat`;

        store.put(
          {
            timestamp: new Date().toISOString(),
            mode: 33206,
            contents: bytes
          },
          key
        ).onsuccess = async () => {
          console.log(`Imported into slot ${slot}:`, key);
          
          // Save to game state
          await gameState.saveState(`slot_${slot}_imported`, {
            date: new Date().toISOString(),
            size: bytes.byteLength
          });
          
          alert(`Save imported into Slot ${slot}. Refresh the page.`);
        };
      };
    };
  };

  reader.readAsArrayBuffer(file);
